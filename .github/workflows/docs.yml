name: Documentation

on:
  push:
    branches: ['docs/**']
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/docs.py'
      - '.github/workflows/docs.yml'
      - '.gitignore'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate documentation and inventory
        run: python3 scripts/docs.py check
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
