<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="theLucius7 的算法竞赛题解归档：浏览各大 Online Judge 题目、源码与 Git 提交记录。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1410" media="(prefers-color-scheme: dark)" />
    <title>Competitive Programming · theLucius7</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./vendor/github-dark.min.css" />
    <link rel="stylesheet" href="./styles.css?v=20260908-system-theme" />
    <script src="./vendor/highlight.min.js" defer></script>
    <script src="./app.js?v=20260908-updates" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#problem-library">跳到题库</a>

    <header class="topbar">
      <a class="brand" href="./" aria-label="Competitive Programming 首页">
        <span class="brand-mark" aria-hidden="true">L7</span>
        <span>Competitive Programming</span>
      </a>
      <nav class="social-links" aria-label="文档与个人链接">
        <a class="social-link" href="./docs/" aria-label="API 文档" title="API 文档">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6v15M12 6C9 3.5 5.5 3 2 4v15c3.5-1 7-.5 10 2M12 6c3-2.5 6.5-3 10-2v15c-3.5-1-7-.5-10 2" />
          </svg>
        </a>
        <a
          class="social-link"
          href="https://x.com/theLucius7"
          target="_blank"
          rel="noreferrer"
          aria-label="X：theLucius7"
          title="X"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.24 2.25h3.31l-7.23 8.26 8.51 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.84L7.08 4.13H5.12l11.96 15.64Z" />
          </svg>
        </a>
        <a
          class="social-link"
          href="https://blog.lucius7.cn"
          target="_blank"
          rel="noreferrer"
          aria-label="博客：blog.lucius7.cn"
          title="Blog"
        >
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.2 2.5 3.3 5.5 3.3 9s-1.1 6.5-3.3 9M12 3c-2.2 2.5-3.3 5.5-3.3 9s1.1 6.5 3.3 9" />
          </svg>
        </a>
        <a
          class="social-link"
          href="https://github.com/theLucius7"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub：theLucius7"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.5 1.1.1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z" />
          </svg>
        </a>
      </nav>
    </header>

    <main>
      <section class="overview" aria-labelledby="page-title">
        <header class="profile-header">
          <div class="profile-identity">
            <p class="eyebrow"><span class="live-dot"></span> COMPETITIVE PROGRAMMING</p>
            <h1 id="page-title">theLucius7</h1>
          </div>
          <div class="sync-line" aria-live="polite">
            <span id="sync-indicator" class="sync-indicator"></span>
            <span id="sync-status">正在载入仓库快照…</span>
          </div>
        </header>

      </section>

      <section class="updates-card" aria-labelledby="updates-title">
        <div class="section-heading">
          <h2 id="updates-title">仓库更新 <span class="branch-label">main</span></h2>
          <a class="section-meta commits-link" href="https://github.com/theLucius7/CompetitiveProgramming/commits/main/" target="_blank" rel="noreferrer">全部提交 ↗</a>
        </div>
        <ol id="commit-list" class="commit-list" aria-label="main 分支最近提交"></ol>
        <p id="updates-status" class="updates-status" role="status">正在载入提交记录…</p>
      </section>

      <section id="problem-library" class="library" aria-labelledby="library-title">
        <div class="section-heading library-heading">
          <div>
            <p class="section-kicker">SOLUTION LIBRARY</p>
            <h2 id="library-title">题目与代码</h2>
          </div>
          <p id="result-count" class="section-meta">载入中…</p>
        </div>

        <div class="toolbar">
          <label class="search-box" for="problem-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
            <input id="problem-search" type="search" placeholder="搜索题号、比赛或文件路径" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <label class="sort-control" for="problem-sort">
            <span>排序</span>
            <select id="problem-sort">
              <option value="submittedAt">按提交时间</option>
              <option value="platform">按 OJ</option>
              <option value="title">按题目</option>
              <option value="path">按路径</option>
            </select>
          </label>
        </div>

        <div id="platform-filters" class="platform-filters" aria-label="按 OJ 平台筛选"></div>

        <div class="table-shell">
          <div class="table-header" aria-hidden="true">
            <span>题目</span><span>OJ</span><span>提交时间</span><span>语言</span><span></span>
          </div>
          <div id="problem-list" class="problem-list" aria-live="polite"></div>
          <div id="empty-state" class="empty-state" hidden>
            <span aria-hidden="true">∅</span>
            <h3>没有找到匹配的题解</h3>
            <p>换一个题号、平台名称或文件路径试试。</p>
          </div>
        </div>
        <button id="load-more" class="load-more" type="button" hidden>显示更多</button>
      </section>
    </main>

    <footer></footer>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="code-drawer" class="code-drawer" aria-labelledby="drawer-title" aria-hidden="true">
      <header class="drawer-header">
        <div>
          <p id="drawer-platform" class="section-kicker"></p>
          <h2 id="drawer-title">代码预览</h2>
          <p id="drawer-path" class="drawer-path"></p>
          <p id="drawer-submission-time" class="drawer-submission-time"></p>
        </div>
        <button id="drawer-close" class="icon-button" type="button" aria-label="关闭代码预览">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <div class="drawer-actions">
        <a id="drawer-problem-link" class="action-button action-primary" target="_blank" rel="noreferrer">打开题目 ↗</a>
        <a id="drawer-github-link" class="action-button" target="_blank" rel="noreferrer">在 GitHub 查看 ↗</a>
        <button id="copy-code" class="action-button" type="button">复制代码</button>
      </div>
      <div id="code-state" class="code-state">选择一道题目以载入代码。</div>
      <div id="code-shell" class="code-shell" hidden>
        <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
        <pre><code id="code-content"></code></pre>
      </div>
    </aside>

    <noscript>
      <div class="noscript">需要启用 JavaScript 才能载入题库与仓库更新。</div>
    </noscript>
  </body>
</html>
